# ══════════════════════════════════════════════════════════════════
# Docker Compose — Microservices Architecture
# SiCure Procurement System — Kelompok Nyawit
# ══════════════════════════════════════════════════════════════════
#
# Arsitektur:
#   ┌─────────────────────────────────────────────────────────┐
#   │                    Docker Network                         │
#   │                                                          │
#   │  [Gateway :80] ──→ [Auth Service :8001] ──→ [auth-db]   │
#   │        │                    ▲                            │
#   │        │                    │ HTTP /verify               │
#   │        ├──→ [Procurement Service :8002] ──→ [proc-db]   │
#   │        │                                                 │
#   │        └──→ [Frontend :5173]                             │
#   └─────────────────────────────────────────────────────────┘
#
# Services (6 total):
#   1. auth-db           — PostgreSQL untuk Auth Service
#   2. procurement-db    — PostgreSQL untuk Procurement Service
#   3. auth-service      — Authentication (port 8001)
#   4. procurement-service — Procurement CRUD (port 8002)
#   5. frontend          — React/Vite (port 5173)
#   6. gateway           — Nginx reverse proxy (port 80)
#
# Cara pakai:
#   docker compose -f docker-compose.microservices.yml up --build -d
#   docker compose -f docker-compose.microservices.yml logs -f
#   docker compose -f docker-compose.microservices.yml down
# ══════════════════════════════════════════════════════════════════

services:
  # ════════════════════════════════════════════════════════════════
  # DATABASES — Satu database per service (prinsip microservices)
  # ════════════════════════════════════════════════════════════════

  auth-db:
    image: postgres:16-alpine
    container_name: sicure-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sicure-network
    restart: unless-stopped

  procurement-db:
    image: postgres:16-alpine
    container_name: sicure-procurement-db
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROC_DB_PASSWORD:-postgres}
    volumes:
      - procurement_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sicure-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # BACKEND SERVICES
  # ════════════════════════════════════════════════════════════════

  auth-service:
    build: ./services/auth-service
    container_name: sicure-auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${AUTH_DB_PASSWORD:-postgres}@auth-db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY:-dev-refresh-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
      SERVICE_NAME: auth-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "auth-service"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sicure-network
    restart: unless-stopped

  procurement-service:
    build: ./services/procurement-service
    container_name: sicure-procurement-service
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${PROC_DB_PASSWORD:-postgres}@procurement-db:5432/procurement_db
      AUTH_SERVICE_URL: http://auth-service:8001
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      SERVICE_NAME: procurement-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "procurement-service"
    volumes:
      - procurement_uploads:/app/uploads
    depends_on:
      procurement-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sicure-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # FRONTEND
  # ════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: sicure-frontend
    environment:
      # Semua API call frontend melalui gateway (port 80)
      VITE_GATEWAY_URL: http://localhost
      VITE_API_BASE_URL: http://localhost/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sicure-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # API GATEWAY — Pintu masuk tunggal
  # ════════════════════════════════════════════════════════════════

  gateway:
    image: nginx:alpine
    container_name: sicure-gateway
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      procurement-service:
        condition: service_healthy
    networks:
      - sicure-network
    restart: unless-stopped

# ════════════════════════════════════════════════════════════════
# VOLUMES — Data persisten
# ════════════════════════════════════════════════════════════════
volumes:
  auth_db_data:
    driver: local
  procurement_db_data:
    driver: local
  procurement_uploads:
    driver: local

# ════════════════════════════════════════════════════════════════
# NETWORK — Semua service dalam 1 network
# ════════════════════════════════════════════════════════════════
networks:
  sicure-network:
    driver: bridge
