# ══════════════════════════════════════════════════════════════════
# API Gateway — Nginx Reverse Proxy
# ══════════════════════════════════════════════════════════════════
#
# Gateway ini adalah "pintu depan" untuk semua request.
# Frontend hanya perlu tahu 1 URL (http://localhost).
# Gateway yang mengarahkan ke service yang tepat berdasarkan URL path.
#
# Routing:
#   /auth/*          → Auth Service (port 8001)
#   /api/v1/auth/*   → Auth Service (port 8001)  ← supaya frontend tidak perlu ubah URL
#   /api/*           → Procurement Service (port 8002)
#   /uploads/*       → Procurement Service (static files)
#   /                → Frontend (port 5173)
#
# Di Docker Compose, "auth-service" dan "procurement-service" adalah
# hostname yang otomatis resolve ke container masing-masing.
# ══════════════════════════════════════════════════════════════════

upstream auth_service {
    server auth-service:8001;
}

upstream procurement_service {
    server procurement-service:8002;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;

    # ── Auth Service routes ───────────────────────────────────────
    # Request ke /auth/* diteruskan ke Auth Service
    # Contoh: POST /auth/login → http://auth-service:8001/login
    location /auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # Supaya frontend yang pakai /api/v1/auth/* tetap berfungsi
    # Contoh: POST /api/v1/auth/login → http://auth-service:8001/login
    location /api/v1/auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # ── Procurement internal endpoints (health, metrics) ──────────
    location = /api/health {
        proxy_pass http://procurement_service/health;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location = /api/metrics {
        proxy_pass http://procurement_service/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # ── Procurement Service routes ────────────────────────────────
    # Semua /api/* (kecuali /api/v1/auth) diteruskan ke Procurement Service
    # Contoh: GET /api/v1/requisitions → http://procurement-service:8002/api/v1/requisitions
    location /api/ {
        proxy_pass http://procurement_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        
        # Untuk upload file (GRN) — naikkan limit body size
        client_max_body_size 10M;
    }

    # Static files (uploaded GRN documents)
    location /uploads/ {
        proxy_pass http://procurement_service/uploads/;
        proxy_set_header Host $host;
    }

    # ── Health check gateway ──────────────────────────────────────
    location /health {
        default_type application/json;
        return 200 '{"status": "healthy", "service": "gateway"}';
    }

    # ── Frontend (React/Vite) ─────────────────────────────────────
    # Semua request lain diteruskan ke frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}
