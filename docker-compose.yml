# ============================================================
# Docker Compose — Cloud App
# Komputasi Awan — SI ITK
# ============================================================
# Note : File ini digunakan untuk menjalankan seluruh layanan aplikasi
# SICURE (Database, Backend, dan Frontend) menggunakan Docker.
# ============================================================
# Usage:
#   docker compose up -d           # Menjalankan semua service di background
#   docker compose down            # Menghentikan dan menghapus semua container
#   docker compose logs -f         # Mellihat Logs secara realtime
#   docker compose ps              # Melihat Status services
# ============================================================

services:
  # ==================== DATABASE ====================
  db:
    image: postgres:16-alpine                                   # Menggunakan PosgreSQL versi ringan (alpine)
    container_name: sicure-db
    restart: unless-stopped                                     # Restart otomatis kecuali dihentikan manual
    environment:
      POSTGRES_USER: postgres                                   # Username Database
      POSTGRES_PASSWORD: adamdi                                 # Password Database
      POSTGRES_DB: sicure                                       # Nama Database yang digunakan
    ports:
      - "5433:5432"                                             # Mapping port lokal 5433 → port PostgreSQL 5432 di container
    volumes:
      - pgdata:/var/lib/postgresql/data                         # Menyimpan data agar tidak hilang (persistent storage)
    networks:
      - cloudnet                                                # Menghubungkan ke network internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sicure"]   # Mengecek apakah database siap digunakan
      interval: 10s                                             # Interval pengecekan
      timeout: 5s                                               # Batas waktu tiap pengecekan             
      retries: 5                                                # Jumlah percobaan sebelum dianggap gagal 
      start_period: 10s                                         # Waktu tunggu sebelum healthcheck dimulai

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend                                        # Folder source code backend
      dockerfile: Dockerfile                                    # Dockerfile untuk build backend
    container_name: sicure-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker                                   # File environment variable khusus Docker
    ports:
      - "8000:8000"                                             # Backend API dapat diakses di localhost:8000
    networks:
      - cloudnet
    depends_on:
      db:
        condition: service_healthy                              # Backend hanya berjalan jika database sudah siap
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]  # Cek endpoint /health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend                                       # Folder source code frontend 
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000                     # URL backend yang digunakan saat build frontend
    container_name: sicure-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                                               # Akses frontend di localhost:3000 (via Nginx port 80)
    networks:
      - cloudnet
    depends_on:
      - backend                                                 # Frontend dijalankan setelah backend

# ==================== VOLUMES ====================
volumes:
  pgdata:
    name: sicure-pgdata                                         # Volume untuk menyimpan data PostgreSQL

# ==================== NETWORKS ====================
networks:
  cloudnet:
    name: sicure-network                                        # Network internal antar container
    driver: bridge                                              # Menggunakan bridge network (default Docker)