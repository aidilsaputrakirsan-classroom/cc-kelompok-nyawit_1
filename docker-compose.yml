services:
  # ==============================================
  # DATABASES (Database per Service)
  # ==============================================
  auth-db:
    image: postgres:16-alpine
    container_name: sicure-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-sicure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicure_dev_password_123}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - sicure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sicure_user} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  procurement-db:
    image: postgres:16-alpine
    container_name: sicure-procurement-db
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: ${POSTGRES_USER:-sicure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicure_dev_password_123}
    ports:
      - "5434:5432"
    volumes:
      - procurement_db_data:/var/lib/postgresql/data
    networks:
      - sicure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sicure_user} -d procurement_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==============================================
  # BACKEND SERVICES
  # ==============================================
  auth-service:
    build: ./services/auth-service
    container_name: sicure-auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sicure_user}:${POSTGRES_PASSWORD:-sicure_dev_password_123}@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-fbe824b20756cc24cf4826a45749f7b0fcd798e1a6136de7257df5bb8507850a}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-7f51b0f55e09f58356247c4583921762c954e7f3747eb4bb57b0dbdfcb99f1fa}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
      APP_ENV: development
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    ports:
      - "8001:8001"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - sicure-network
    restart: unless-stopped

  procurement-service:
    build: ./services/procurement-service
    container_name: sicure-procurement-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sicure_user}:${POSTGRES_PASSWORD:-sicure_dev_password_123}@procurement-db:5432/procurement_db
      AUTH_SERVICE_URL: http://auth-service:8001
      ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_SIZE_MB: 5
      APP_ENV: development
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    ports:
      - "8002:8002"
    volumes:
      - ./services/procurement-service/uploads:/app/uploads
    depends_on:
      procurement-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - sicure-network
    restart: unless-stopped

  # ==============================================
  # FRONTEND
  # ==============================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: sicure-frontend
    environment:
      VITE_API_BASE_URL: http://localhost/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - procurement-service
    networks:
      - sicure-network
    restart: unless-stopped

  # ==============================================
  # API GATEWAY
  # ==============================================
  gateway:
    image: nginx:alpine
    container_name: sicure-gateway
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - procurement-service
      - frontend
    networks:
      - sicure-network
    restart: unless-stopped

volumes:
  auth_db_data:
    driver: local
  procurement_db_data:
    driver: local

networks:
  sicure-network:
    driver: bridge
