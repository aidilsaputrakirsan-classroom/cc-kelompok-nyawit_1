# ==============================================
# CI Pipeline — SiCure (Sistem Information Procurement)
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
# 
# Jobs:
# 1. test-backend: Install deps + run pytest (async database tests)
# 2. test-frontend: Install deps + run vitest + build
# 3. build-docker: Build Docker images (hanya jika tests PASS)
# 4. deploy: Deploy ke Railway (hanya push ke main)
#
# Optimizations:
# - Caching untuk pip dan npm dependencies
# - Parallel jobs untuk kecepatan maksimal
# - Timeout protection (10 menit per job)

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs if new push happens (save resources)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Backend (Python/FastAPI)
  # ================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            --asyncio-mode=auto \
            -v

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ================================
  # JOB 2: Test Frontend (React/Vitest)
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 📁 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ================================
  # JOB 3: Build Docker Images
  # ================================
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend]  # Hanya jalan jika kedua test PASS

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build backend image
        run: |
          docker build \
            -t sicure-backend:ci \
            -f backend/Dockerfile \
            .

      - name: 🐳 Build frontend image
        run: |
          docker build \
            -t sicure-frontend:ci \
            --target builder \
            -f frontend/Dockerfile \
            .

      - name: ✅ Verify images
        run: |
          echo "✅ All Docker images built successfully!"
          docker images | grep sicure
          echo ""
          echo "Backend image size:"
          docker images sicure-backend:ci --format "{{.Size}}"
          echo "Frontend image size:"
          docker images sicure-frontend:ci --format "{{.Size}}"

  # ================================
  # JOB 4: Deploy ke Railway (CD)
  # ================================
  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚂 Install Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service backend --detach

      - name: 🚀 Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd frontend
          railway up --service frontend --detach

      - name: 🏥 Health check
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          if [ -z "$RAILWAY_BACKEND_URL" ]; then
            echo "⚠️ RAILWAY_BACKEND_URL belum di-set — lewati health check"
            exit 0
          fi

          echo "Waiting for deployment to be ready..."
          sleep 30

          HEALTH_URL="${RAILWAY_BACKEND_URL%/}/health"
          HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL")
          echo "Response ($HTTP_STATUS):"
          cat /tmp/health.json || true

          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check FAILED! (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: ✅ Deploy summary
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          RAILWAY_FRONTEND_URL: ${{ secrets.RAILWAY_FRONTEND_URL }}
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${RAILWAY_BACKEND_URL:-belum dikonfigurasi} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${RAILWAY_FRONTEND_URL:-belum dikonfigurasi} |" >> $GITHUB_STEP_SUMMARY
