# ==============================================
# CI Pipeline — SiCure (Sistem Information Procurement)
# ==============================================
# Pipeline ini berjalan otomatis saat:
# - Push ke branch main
# - Pull Request ke branch main
# 
# Jobs:
# 1. test-backend: Install deps + run pytest (unit + integration test, async DB)
# 2. test-frontend: Install deps + run vitest + build
# 3. build-docker: Build Docker images (hanya jika tests PASS)
#
# Optimizations:
# - Caching untuk pip dan npm dependencies
# - Parallel jobs untuk kecepatan maksimal
# - Timeout protection (10 menit per job)

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs if new push happens (save resources)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================
  # JOB 1: Test Backend (Python/FastAPI)
  # ================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        # Menjalankan unit test (aturan bisnis/util) + integration test
        # (alur end-to-end auth → PR → PO → GRN) sekaligus, dengan coverage.
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40 \
            --asyncio-mode=auto \
            -v

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ================================
  # JOB 2: Test Frontend (React/Vitest)
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 📁 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ================================
  # JOB 3: Build Docker Images
  # ================================
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend]  # Hanya jalan jika kedua test PASS

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build backend image
        run: |
          docker build \
            -t sicure-backend:ci \
            -f backend/Dockerfile \
            .

      - name: 🐳 Build frontend image
        run: |
          docker build \
            -t sicure-frontend:ci \
            --target builder \
            -f frontend/Dockerfile \
            .

      - name: ✅ Verify images
        run: |
          echo "✅ All Docker images built successfully!"
          docker images | grep sicure
          echo ""
          echo "Backend image size:"
          docker images sicure-backend:ci --format "{{.Size}}"
          echo "Frontend image size:"
          docker images sicure-frontend:ci --format "{{.Size}}"

  # ================================
  # JOB 4: Verify Deploy (CD)
  # ================================
  # Railway melakukan auto-deploy setiap merge ke `main` (lihat
  # docs/railway-deployment.md). Job ini melengkapi tahap pipeline
  # "checkout → test → build → deploy" dengan MEMBUKTIKAN hasil deploy
  # benar-benar online: setelah build hijau, tunggu Railway selesai
  # redeploy lalu cek health endpoint di production URL.
  #
  # Hanya berjalan pada push/merge ke `main` (bukan PR), karena hanya
  # `main` yang ter-deploy ke produksi.
  #
  # URL diambil dari repository variable `PRODUCTION_API_URL`
  # (Settings → Secrets and variables → Actions → Variables).
  # Bila belum di-set, dipakai default domain dari README.
  verify-deploy:
    name: 🚀 Verify Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: ⏳ Wait for Railway auto-deploy
        # Beri waktu Railway membangun & merilis image terbaru sebelum dicek.
        run: sleep 60

      - name: ❤️ Health check production URL
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL || 'https://sicure-api.up.railway.app' }}
        run: |
          echo "Mengecek health di: $API_URL/health"
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$API_URL/health" || echo "000")
            echo "Percobaan $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Production sehat setelah deploy:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Belum siap, tunggu 30 detik..."
            sleep 30
          done
          echo "❌ Production URL tidak sehat setelah beberapa percobaan."
          cat /tmp/health.json || true
          exit 1
