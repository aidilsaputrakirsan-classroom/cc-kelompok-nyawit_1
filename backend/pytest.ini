[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: test integrasi end-to-end lintas modul (auth → PR → PO → GRN)
    unit: unit test untuk fungsi/aturan bisnis murni
addopts = 
    -v
    --tb=short
    --asyncio-mode=auto
    -W ignore::UserWarning
    --cov=app
    --cov-report=term-missing
    --cov-config=pyproject.toml